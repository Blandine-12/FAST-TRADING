<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Fast Trading</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #f4f6f9;
}

.navbar {
    background: linear-gradient(135deg, #0d6efd, #6610f2);
}

.card-box {
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    margin-bottom: 15px;
}

.badge-status {
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
}

.pending { background: #fff3cd; color: #856404; }
.approved { background: #d1e7dd; color: #0f5132; }
.rejected { background: #f8d7da; color: #842029; }
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark px-3">
    <span class="navbar-brand">🧑‍💼 Admin Dashboard</span>
     <a class="btn btn-outline-light me-2" href="login.html">logout</a>
</nav>

<div class="container mt-4">

    <h4 class="mb-3">📦 All Selling Requests</h4>

    <div id="orders"></div>

</div>

<script>

// ---------------- AUTH CHECK ----------------
let currentUser = JSON.parse(localStorage.getItem("currentUser"));

if (!currentUser || currentUser.role !== "ADMIN") {
    alert("Access denied! Admin only");
    window.location.href = "index.html";
}

// ---------------- LOAD ORDERS ----------------
function loadOrders() {
    let sales = JSON.parse(localStorage.getItem("sales")) || [];
    let container = document.getElementById("orders");

    if (sales.length === 0) {
        container.innerHTML = "<div class='alert alert-info'>No requests found</div>";
        return;
    }

    let html = "";

    sales.forEach((item, index) => {

        let statusClass = item.status === "APPROVED" ? "approved"
                        : item.status === "REJECTED" ? "rejected"
                        : "pending";

        html += `
        <div class="card card-box p-3">

            <div class="d-flex justify-content-between">
                <h5>${item.product}</h5>
                <span class="badge-status ${statusClass}">${item.status}</span>
            </div>

            <p><b>Price:</b> ${item.price} RWF</p>
            <p><b>Owner:</b> ${item.name} | ${item.phone}</p>
            <p><b>Location:</b> ${item.district} - ${item.sector}</p>
            <p><b>Description:</b> ${item.description}</p>

            <div class="mt-2">
                <button class="btn btn-success btn-sm" onclick="approve(${index})">Approve</button>
                <button class="btn btn-danger btn-sm" onclick="reject(${index})">Reject</button>
            </div>

        </div>
        `;
    });

    container.innerHTML = html;
}

// ---------------- APPROVE ----------------
function approve(index) {
    let sales = JSON.parse(localStorage.getItem("sales")) || [];
    sales[index].status = "APPROVED";
    localStorage.setItem("sales", JSON.stringify(sales));
    loadOrders();
}

// ---------------- REJECT ----------------
function reject(index) {
    let sales = JSON.parse(localStorage.getItem("sales")) || [];
    sales[index].status = "REJECTED";
    localStorage.setItem("sales", JSON.stringify(sales));
    loadOrders();
}

// ---------------- LOGOUT ----------------
function logout() {
    localStorage.removeItem("currentUser");
    window.location.href = "index.html";
}

// init
loadOrders();

</script>

</body>
</html>
