<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - Fast Trading</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
body {
    background: #f4f6f9;
}

/* HERO */
.hero {
    background: linear-gradient(135deg, #0d6efd, #6610f2);
    color: white;
    padding: 60px 20px;
    text-align: center;
}

.hero h1 {
    font-weight: bold;
}

/* CARD */
.contact-card {
    max-width: 1000px;
    margin: -50px auto 40px auto;
    background: white;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    overflow: hidden;
}

/* FORM */
.form-control {
    border-radius: 10px;
}

.btn {
    border-radius: 10px;
    padding: 12px;
}

/* INFO BOX */
.info-box {
    background: #f8f9fa;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 15px;
}

.info-box i {
    font-size: 22px;
    color: #0d6efd;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
    <h1>📞 Contact Us</h1>
    <p>We are here to help you anytime</p>
</div>

<!-- CONTACT SECTION -->
<div class="container">

<div class="contact-card p-4">

    <div class="row g-4">

        <!-- LEFT INFO -->
        <div class="col-md-5">

            <h4 class="mb-3">📍 Get in Touch</h4>

            <div class="info-box">
                <i class="bi bi-geo-alt-fill"></i>
                <div>
                    <b>Location</b><br>
                    Kigali, Rwanda
                </div>
            </div>

            <div class="info-box">
                <i class="bi bi-telephone-fill"></i>
                <div>
                    <b>Phone</b><br>
                    +250 793196820
                </div>
            </div>

            <div class="info-box">
                <i class="bi bi-envelope-fill"></i>
                <div>
                    <b>Email</b><br>
                    support@fasttrading.com
                </div>
            </div>

            <div class="info-box">
                <i class="bi bi-clock-fill"></i>
                <div>
                    <b>Working Hours</b><br>
                    24/7 Support
                </div>
            </div>

        </div>

        <!-- RIGHT FORM -->
        <div class="col-md-7">

            <h4 class="mb-3">✉️ Send Message</h4>

            <form id="contactForm">

                <div class="row g-3">

                    <div class="col-md-6">
                        <input type="text" class="form-control" id="name" placeholder="Your Name" required>
                    </div>

                    <div class="col-md-6">
                        <input type="text" class="form-control" id="phone" placeholder="Phone Number" required>
                    </div>

                    <div class="col-12">
                        <input type="email" class="form-control" id="email" placeholder="Email Address">
                    </div>

                    <div class="col-12">
                        <textarea class="form-control" id="message" rows="5" placeholder="Write your message..." required></textarea>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-primary w-100">
                            Send Message
                        </button>
                    </div>

                </div>

            </form>

        </div>

    </div>

</div>

</div>

<script>
// Save messages in localStorage
document.getElementById("contactForm").addEventListener("submit", function(e){
    e.preventDefault();

    let msg = {
        id: Date.now(),
        name: name.value,
        phone: phone.value,
        email: email.value,
        message: message.value,
        date: new Date().toLocaleString()
    };

    let messages = JSON.parse(localStorage.getItem("messages")) || [];
    messages.push(msg);
    localStorage.setItem("messages", JSON.stringify(messages));

    alert("Message sent successfully!");
    this.reset();
});
</script>

</body>
</html>
