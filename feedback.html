<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Selling Requests</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #f4f6f9;
}

.container-box {
    max-width: 900px;
    margin: 50px auto;
}

.card {
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

.header {
    background: linear-gradient(135deg, #0d6efd, #6610f2);
    color: white;
    padding: 25px;
    border-radius: 15px 15px 0 0;
    text-align: center;
}

.status-badge {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.pending { background: #fff3cd; color: #856404; }
.approved { background: #d1e7dd; color: #0f5132; }
.rejected { background: #f8d7da; color: #842029; }

.product-card {
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
    background: white;
}
</style>
</head>

<body>

<div class="container container-box">

    <div class="card">

        <div class="header">
            <h2>📦 My Selling Requests</h2>
            <p>Check if your product is approved or pending</p>
        </div>

        <div class="card-body p-4">

            <!-- Search -->
            <div class="mb-3">
                <label class="form-label">Enter your phone number</label>
                <input type="text" id="phoneInput" class="form-control" placeholder="e.g. 07XXXXXXXX">
            </div>

            <button class="btn btn-primary w-100 mb-4" onclick="loadRequests()">
                Check My Requests
            </button>

            <!-- Results -->
            <div id="results"></div>

        </div>
    </div>

</div>

<script>
function getStatusBadge(status) {
    if (status === "APPROVED") {
        return '<span class="status-badge approved">APPROVED</span>';
    } 
    else if (status === "REJECTED") {
        return '<span class="status-badge rejected">REJECTED</span>';
    }
    return '<span class="status-badge pending">PENDING</span>';
}

function loadRequests() {
    let phone = document.getElementById("phoneInput").value.trim();
    let resultsDiv = document.getElementById("results");

    if (!phone) {
        resultsDiv.innerHTML = "<div class='alert alert-warning'>Please enter phone number</div>";
        return;
    }

    let sales = JSON.parse(localStorage.getItem("sales")) || [];

    let userSales = sales.filter(s => s.phone === phone);

    if (userSales.length === 0) {
        resultsDiv.innerHTML = "<div class='alert alert-danger'>No requests found for this number</div>";
        return;
    }

    let html = "";

    userSales.forEach(item => {
        html += `
        <div class="product-card">
            <div class="d-flex justify-content-between align-items-center">
                <h5>${item.product}</h5>
                ${getStatusBadge(item.status)}
            </div>

            <p class="mb-1"><b>Price:</b> ${item.price} RWF</p>
            <p class="mb-1"><b>Location:</b> ${item.district} - ${item.sector}</p>
            <p class="mb-1"><b>Speed:</b> ${item.speed}</p>
            <p class="text-muted"><b>Description:</b> ${item.description}</p>

            <small class="text-muted">Submitted: ${new Date(item.createdAt).toLocaleString()}</small>
        </div>
        `;
    });

    resultsDiv.innerHTML = html;
}
</script>

</body>
</html>
